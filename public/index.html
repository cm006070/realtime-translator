<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REALTIME VOICE TRANSLATOR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e;
  --accent:#00ff88; --accent2:#ff6b35; --accent3:#7c6dfa;
  --text:#e8e8f0; --muted:#555570; --live:#ff3366;
}

body {
  font-family:'Syne',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

.container {
  position:relative;
  z-index:1;
  width:100%;
  max-width:900px;
  padding:32px 20px 60px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

header {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:1px solid var(--border);
  padding-bottom:20px;
}

.logo {
  font-size:11px;
  font-weight:700;
  letter-spacing:.25em;
  color:var(--muted);
  text-transform:uppercase;
}

h1 {
  font-size:clamp(42px,8vw,78px);
  font-weight:800;
  line-height:.9;
  background:linear-gradient(135deg,var(--accent),var(--accent3),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.badge {
  font-family:'Syne Mono',monospace;
  color:var(--live);
  border:1px solid var(--live);
  padding:6px 14px;
  border-radius:3px;
  font-size:11px;
  letter-spacing:.2em;
}

.lang-row {
  display:flex;
  align-items:center;
  gap:18px;
}

.lang-box {
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:5px;
  padding:16px;
  text-align:center;
}

.lang-label {
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.2em;
  margin-bottom:8px;
}

.lang-select {
  width:100%;
  background:transparent;
  border:0;
  color:var(--text);
  font-size:22px;
  font-weight:700;
  text-align:center;
  outline:none;
  appearance:none;
}

.lang-select option { background:#111118; }

.arrow-icon {
  color:var(--accent3);
  font-size:28px;
}

.waveform-wrap {
  height:70px;
}

#waveCanvas {
  width:100%;
  height:100%;
}

.record-area {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:20px 0;
}

.record-btn {
  width:110px;
  height:110px;
  border-radius:50%;
  border:2px solid var(--accent);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.record-btn.recording {
  border-color:var(--live);
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow:0 0 0 0 rgba(255,51,102,.4); }
  70% { box-shadow:0 0 0 22px rgba(255,51,102,0); }
  100% { box-shadow:0 0 0 0 rgba(255,51,102,0); }
}

.record-icon {
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--accent);
}

.record-btn.recording .record-icon {
  width:30px;
  height:30px;
  border-radius:5px;
  background:var(--live);
}

.record-status {
  font-family:'Syne Mono',monospace;
  color:var(--muted);
  letter-spacing:.2em;
  font-size:12px;
}

.panels {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.panel {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:5px;
  overflow:hidden;
}

.panel-header {
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

.panel-title {
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
}

.panel-lang {
  color:var(--accent3);
  font-weight:700;
}

.panel-body {
  min-height:150px;
  padding:22px 18px;
  font-size:17px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.panel-body.empty {
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:'Syne Mono',monospace;
  font-size:13px;
}

.error-banner {
  display:none;
  background:rgba(255,51,102,.1);
  border:1px solid rgba(255,51,102,.35);
  color:var(--live);
  padding:13px 16px;
  border-radius:5px;
  font-family:'Syne Mono',monospace;
}

.error-banner.show { display:block; }

.statusbar {
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:5px;
  padding:12px 16px;
  color:var(--muted);
  font-family:'Syne Mono',monospace;
  font-size:12px;
}

.status-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
}

.statusbar.connected .status-dot { background:var(--accent); }
.statusbar.recording .status-dot { background:var(--live); }
.statusbar.error .status-dot { background:var(--live); }

@media (max-width:650px) {
  .panels { grid-template-columns:1fr; }
  .lang-row { flex-direction:column; }
}
</style>
</head>

<body>
<div class="container">
  <header>
    <div>
      <div class="logo">OpenAI Realtime API</div>
      <h1>VOICE<br>TRANSLATOR</h1>
    </div>
    <div class="badge">LIVE</div>
  </header>

  <div class="lang-row">
    <div class="lang-box">
      <div class="lang-label">入力言語</div>
      <select class="lang-select" id="srcLang">
        <option value="auto">自動検出</option>
      </select>
    </div>

    <div class="arrow-icon">→</div>

    <div class="lang-box">
      <div class="lang-label">翻訳先</div>
      <select class="lang-select" id="tgtLang">
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="record-area">
    <div class="waveform-wrap">
      <canvas id="waveCanvas"></canvas>
    </div>

    <button class="record-btn" id="recordBtn">
      <div class="record-icon"></div>
    </button>

    <div class="record-status" id="recordStatus">TAP TO START</div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">認識テキスト</span>
        <span class="panel-lang">AUTO</span>
      </div>
      <div class="panel-body empty" id="transcriptPanel">
        話すとリアルタイムで<br>ここに表示されます
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">翻訳結果</span>
        <span class="panel-lang">EN</span>
      </div>
      <div class="panel-body empty" id="translationPanel">
        翻訳がリアルタイムで<br>ここに流れます
      </div>
    </div>
  </div>

  <div class="statusbar" id="statusBar">
    <div class="status-dot"></div>
    <div id="statusText">サーバーに接続中...</div>
  </div>
</div>

<script>
let ws = null;
let mediaStream = null;
let audioContext = null;
let sourceNode = null;
let processor = null;
let analyser = null;
let isRecording = false;
let animFrameId = null;

let inputTranscript = "";
let outputTranscript = "";

const TARGET_SAMPLE_RATE = 24000;

const recordBtn = document.getElementById("recordBtn");
const recordStatus = document.getElementById("recordStatus");
const transcriptPanel = document.getElementById("transcriptPanel");
const translationPanel = document.getElementById("translationPanel");
const errorBanner = document.getElementById("errorBanner");
const statusBar = document.getElementById("statusBar");
const statusText = document.getElementById("statusText");
const canvas = document.getElementById("waveCanvas");
const ctx = canvas.getContext("2d");

connectWS();

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    setStatus("接続完了。録音ボタンを押してください", "connected");
  };

  ws.onmessage = (e) => {
    let event;
    try {
      event = JSON.parse(e.data);
    } catch {
      return;
    }

    handleServerEvent(event);
  };

  ws.onerror = () => {
    showError("WebSocket接続エラー");
  };

  ws.onclose = () => {
    setStatus("切断されました。ページを再読み込みしてください", "error");
    stopLocalAudioOnly();
  };
}

function handleServerEvent(event) {
  if (event.type === "proxy.connected") {
    setStatus("OpenAI Realtime Translation に接続しました", "connected");
    return;
  }

  if (event.type === "proxy.disconnected") {
    setStatus("OpenAI接続が終了しました", "connected");
    return;
  }

  if (event.type === "error") {
    showError(event.message || event.error?.message || "Unknown error");
    return;
  }

  if (event.type === "session.input_transcript.delta") {
    inputTranscript += event.delta || "";
    renderText(transcriptPanel, inputTranscript);
    return;
  }

  if (event.type === "session.output_transcript.delta") {
    outputTranscript += event.delta || "";
    renderText(translationPanel, outputTranscript);
    return;
  }

  if (event.type === "session.closed") {
    setStatus("翻訳セッションを終了しました", "connected");
    return;
  }

  // デバッグ用。不要なら消してOK。
  console.log("OpenAI event:", event.type, event);
}

recordBtn.addEventListener("click", async () => {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function startRecording() {
  clearError();

  inputTranscript = "";
  outputTranscript = "";
  transcriptPanel.className = "panel-body empty";
  transcriptPanel.innerHTML = "話すとリアルタイムで<br>ここに表示されます";
  translationPanel.className = "panel-body empty";
  translationPanel.innerHTML = "翻訳がリアルタイムで<br>ここに流れます";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });
  } catch (err) {
    showError("マイクへのアクセスが拒否されました: " + err.message);
    return;
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  sourceNode = audioContext.createMediaStreamSource(mediaStream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  sourceNode.connect(analyser);

  processor = audioContext.createScriptProcessor(4096, 1, 1);
  sourceNode.connect(processor);
  processor.connect(audioContext.destination);

  processor.onaudioprocess = (e) => {
    if (!isRecording) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);
    const pcm24k = resampleFloat32(input, audioContext.sampleRate, TARGET_SAMPLE_RATE);
    const pcm16 = floatToPCM16(pcm24k);
    const base64 = pcm16ToBase64(pcm16);

    ws.send(JSON.stringify({
      type: "session.input_audio_buffer.append",
      audio: base64
    }));
  };

  isRecording = true;
  recordBtn.classList.add("recording");
  recordStatus.textContent = "RECORDING — TAP TO STOP";
  setStatus("録音中 — 話してください", "recording");
  drawWave();
}

function stopRecording() {
  stopLocalAudioOnly();

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "session.close" }));
  }

  setStatus("停止しました。残りの翻訳を処理中...", "connected");
}

function stopLocalAudioOnly() {
  isRecording = false;

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (sourceNode) {
    sourceNode.disconnect();
    sourceNode = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }

  clearCanvas();
  recordBtn.classList.remove("recording");
  recordStatus.textContent = "TAP TO START";
}

function resampleFloat32(input, fromRate, toRate) {
  if (fromRate === toRate) return input;

  const ratio = fromRate / toRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const index = i * ratio;
    const indexFloor = Math.floor(index);
    const indexCeil = Math.min(indexFloor + 1, input.length - 1);
    const weight = index - indexFloor;

    output[i] = input[indexFloor] * (1 - weight) + input[indexCeil] * weight;
  }

  return output;
}

function floatToPCM16(float32Array) {
  const pcm16 = new Int16Array(float32Array.length);

  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }

  return pcm16;
}

function pcm16ToBase64(pcm16) {
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = "";

  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }

  return btoa(binary);
}

function renderText(el, text) {
  if (!text.trim()) return;
  el.classList.remove("empty");
  el.textContent = text;
}

function drawWave() {
  if (!isRecording) return;

  animFrameId = requestAnimationFrame(drawWave);

  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, W, H);

  if (!analyser) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);

  ctx.strokeStyle = "#00ff88";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#00ff88";
  ctx.shadowBlur = 8;
  ctx.beginPath();

  const step = W / data.length;

  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 128) * (H / 2);
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  }

  ctx.stroke();
}

function clearCanvas() {
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
}

function showError(message) {
  errorBanner.textContent = "⚠ " + message;
  errorBanner.classList.add("show");
  setStatus(message, "error");
}

function clearError() {
  errorBanner.classList.remove("show");
}

function setStatus(message, cls) {
  statusText.textContent = message;
  statusBar.className = "statusbar " + (cls || "");
}
</script>
</body>
</html>
