<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realtime Voice Translator</title>
<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0a0a0f;
  color: #eee;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 900px;
  padding: 32px 20px;
}
h1 {
  font-size: 48px;
  margin: 0 0 24px;
}
button {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid #00ff88;
  background: transparent;
  color: #00ff88;
  font-size: 14px;
  cursor: pointer;
}
button.recording {
  border-color: #ff3366;
  color: #ff3366;
}
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 24px;
}
.panel {
  background: #111118;
  border: 1px solid #222235;
  border-radius: 8px;
  padding: 18px;
  min-height: 220px;
  white-space: pre-wrap;
  line-height: 1.7;
}
.status {
  margin-top: 20px;
  color: #aaa;
}
.error {
  margin-top: 16px;
  color: #ff3366;
}
canvas {
  width: 100%;
  height: 70px;
  margin: 20px 0;
}
@media (max-width: 700px) {
  .panels { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="container">
  <h1>VOICE TRANSLATOR</h1>

  <canvas id="wave"></canvas>

  <button id="recordBtn">START</button>

  <div class="status" id="status">接続中...</div>
  <div class="error" id="error"></div>

  <div class="panels">
    <div>
      <h3>認識テキスト</h3>
      <div class="panel" id="transcript">ここに認識結果が表示されます</div>
    </div>
    <div>
      <h3>翻訳結果</h3>
      <div class="panel" id="translation">ここに翻訳結果が表示されます</div>
    </div>
  </div>
</div>

<script>
let ws = null;
let mediaStream = null;
let audioContext = null;
let sourceNode = null;
let processor = null;
let analyser = null;
let isRecording = false;
let animationId = null;

let transcriptText = "";
let translationText = "";

const TARGET_SAMPLE_RATE = 24000;

const recordBtn = document.getElementById("recordBtn");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const transcriptEl = document.getElementById("transcript");
const translationEl = document.getElementById("translation");
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");

connectWS();

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    statusEl.textContent = "接続完了。録音できます。";
  };

  ws.onmessage = (e) => {
    let event;
    try {
      event = JSON.parse(e.data);
    } catch {
      return;
    }

    handleEvent(event);
  };

  ws.onerror = () => {
    errorEl.textContent = "WebSocket接続エラー";
  };

  ws.onclose = () => {
    statusEl.textContent = "切断されました。再接続します...";
    stopLocalAudioOnly();
    setTimeout(connectWS, 1000);
  };
}

function handleEvent(event) {
  if (event.type === "proxy.connected") {
    statusEl.textContent = "OpenAIに接続しました。";
    return;
  }

  if (event.type === "proxy.disconnected") {
    statusEl.textContent = "OpenAI接続が切断されました。";
    return;
  }

  if (event.type === "error") {
    errorEl.textContent = event.message || event.error?.message || "Unknown error";
    return;
  }

  // Translation API の入力文字起こし
  if (event.type === "session.input_transcript.delta") {
    transcriptText += event.delta || "";
    transcriptEl.textContent = transcriptText;
    return;
  }

  // Translation API の翻訳出力
  if (event.type === "session.output_transcript.delta") {
    translationText += event.delta || "";
    translationEl.textContent = translationText;
    return;
  }

  console.log("OpenAI event:", event.type, event);
}

recordBtn.addEventListener("click", async () => {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function ensureWSOpen() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  connectWS();

  await new Promise((resolve) => {
    const timer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        clearInterval(timer);
        resolve();
      }
    }, 50);
  });
}

async function startRecording() {
  errorEl.textContent = "";
  await ensureWSOpen();

  transcriptText = "";
  translationText = "";
  transcriptEl.textContent = "";
  translationEl.textContent = "";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });
  } catch (err) {
    errorEl.textContent = "マイクへのアクセスが拒否されました: " + err.message;
    return;
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  sourceNode = audioContext.createMediaStreamSource(mediaStream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  sourceNode.connect(analyser);

  processor = audioContext.createScriptProcessor(4096, 1, 1);
  sourceNode.connect(processor);
  processor.connect(audioContext.destination);

  isRecording = true;

  processor.onaudioprocess = (e) => {
    if (!isRecording) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);
    const resampled = resampleFloat32(
      input,
      audioContext.sampleRate,
      TARGET_SAMPLE_RATE
    );

    const pcm16 = floatToPCM16(resampled);
    const base64 = pcm16ToBase64(pcm16);

    ws.send(JSON.stringify({
      type: "session.input_audio_buffer.append",
      audio: base64
    }));
  };

  recordBtn.classList.add("recording");
  recordBtn.textContent = "STOP";
  statusEl.textContent = "録音中。話してください。";

  drawWave();
}

function stopRecording() {
  stopLocalAudioOnly();

  // 重要:
  // ここで session.close は送らない。
  // 送ると2回目以降に反応しなくなる。
  statusEl.textContent = "停止しました。もう一度録音できます。";
}

function stopLocalAudioOnly() {
  isRecording = false;

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (sourceNode) {
    sourceNode.disconnect();
    sourceNode = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  clearCanvas();

  recordBtn.classList.remove("recording");
  recordBtn.textContent = "START";
}

function resampleFloat32(input, fromRate, toRate) {
  if (fromRate === toRate) return input;

  const ratio = fromRate / toRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const index = i * ratio;
    const indexFloor = Math.floor(index);
    const indexCeil = Math.min(indexFloor + 1, input.length - 1);
    const weight = index - indexFloor;

    output[i] =
      input[indexFloor] * (1 - weight) +
      input[indexCeil] * weight;
  }

  return output;
}

function floatToPCM16(float32Array) {
  const pcm16 = new Int16Array(float32Array.length);

  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }

  return pcm16;
}

function pcm16ToBase64(pcm16) {
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = "";
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, i + chunkSize)
    );
  }

  return btoa(binary);
}

function drawWave() {
  if (!isRecording) return;

  animationId = requestAnimationFrame(drawWave);

  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, W, H);

  if (!analyser) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);

  ctx.strokeStyle = "#00ff88";
  ctx.lineWidth = 2;
  ctx.beginPath();

  const step = W / data.length;

  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 128) * (H / 2);
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  }

  ctx.stroke();
}

function clearCanvas() {
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
}

window.addEventListener("beforeunload", () => {
  // ページを閉じる時だけ終了
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "session.close" }));
  }
});
</script>
</body>
</html>
