<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realtime Voice Translator</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0a0a0f;
  color: #eee;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 900px;
  padding: 32px 20px;
}

h1 {
  font-size: 42px;
  margin: 0 0 24px;
}

select {
  margin-bottom: 12px;
  padding: 12px 16px;
  background: #111118;
  color: white;
  border: 1px solid #333;
  border-radius: 8px;
  font-size: 16px;
  width: 100%;
  max-width: 360px;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}

label {
  color: #ccc;
  font-size: 14px;
}

button {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid #00ff88;
  background: transparent;
  color: #00ff88;
  font-size: 14px;
  cursor: pointer;
}

button.recording {
  border-color: #ff3366;
  color: #ff3366;
}

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 24px;
}

.panel {
  background: #111118;
  border: 1px solid #222235;
  border-radius: 8px;
  padding: 18px;
  min-height: 220px;
  white-space: pre-wrap;
  line-height: 1.7;
}

.status {
  margin-top: 20px;
  color: #aaa;
}

.error {
  margin-top: 16px;
  color: #ff3366;
  white-space: pre-wrap;
}

canvas {
  width: 100%;
  height: 70px;
  margin: 20px 0;
}

.meterWrap {
  width: 100%;
  height: 10px;
  background: #1b1b28;
  border-radius: 999px;
  overflow: hidden;
  margin: 12px 0;
}

#meter {
  height: 100%;
  width: 0%;
  background: #00ff88;
}

.log {
  background: #111118;
  border: 1px solid #222235;
  border-radius: 8px;
  padding: 14px;
  max-height: 180px;
  overflow: auto;
  white-space: pre-wrap;
  color: #bbb;
  line-height: 1.6;
}

@media (max-width: 700px) {
  .panels {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 34px;
  }
}
</style>
</head>

<body>
<div class="container">
  <h1>VOICE TRANSLATOR</h1>

  <div class="controls">
    <div>
      <label>翻訳方向</label><br />
      <select id="directionSelect">
        <option value="en-ja">English → 日本語</option>
        <option value="ja-en">日本語 → English</option>
      </select>
    </div>

    <div>
      <label>音声モード</label><br />
      <select id="audioModeSelect">
        <option value="meeting" selected>オンライン会議モード</option>
        <option value="normal">通常マイクモード</option>
      </select>
    </div>
  </div>

  <canvas id="wave"></canvas>

  <div class="meterWrap">
    <div id="meter"></div>
  </div>
  <div id="volumeText">音量: 0%</div>

  <br />
  <button id="recordBtn">START</button>

  <div class="status" id="status">接続中...</div>
  <div class="error" id="error"></div>

  <div class="panels">
    <div>
      <h3>認識テキスト</h3>
      <div class="panel" id="transcript">ここに認識結果が表示されます</div>
    </div>

    <div>
      <h3>翻訳結果</h3>
      <div class="panel" id="translation">ここに翻訳結果が表示されます</div>
    </div>
  </div>

  <h3>診断ログ</h3>
  <div class="log" id="diagnosticLog"></div>
</div>

<script>
let ws = null;
let mediaStream = null;
let audioContext = null;
let sourceNode = null;
let processor = null;
let analyser = null;
let isRecording = false;
let animationId = null;

let transcriptText = "";
let translationText = "";

const TARGET_SAMPLE_RATE = 24000;

const directionSelect = document.getElementById("directionSelect");
const audioModeSelect = document.getElementById("audioModeSelect");
const recordBtn = document.getElementById("recordBtn");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const transcriptEl = document.getElementById("transcript");
const translationEl = document.getElementById("translation");
const diagnosticLogEl = document.getElementById("diagnosticLog");
const volumeTextEl = document.getElementById("volumeText");
const meterEl = document.getElementById("meter");
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");

connectWS();

function nowTime() {
  return new Date().toLocaleTimeString("ja-JP", { hour12: false });
}

function logDiagnostic(message) {
  diagnosticLogEl.textContent += `[${nowTime()}] ${message}\n`;
  diagnosticLogEl.scrollTop = diagnosticLogEl.scrollHeight;
}

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    statusEl.textContent = "接続完了。録音できます。";
    logDiagnostic("browser.websocket.open");
    sendDirectionConfig();
  };

  ws.onmessage = (e) => {
    let event;
    try {
      event = JSON.parse(e.data);
    } catch {
      return;
    }

    handleEvent(event);
  };

  ws.onerror = () => {
    errorEl.textContent = "WebSocket接続エラー";
    logDiagnostic("browser.websocket.error");
  };

  ws.onclose = () => {
    statusEl.textContent = "切断されました。再接続します...";
    logDiagnostic("browser.websocket.close");
    stopLocalAudioOnly();
    setTimeout(connectWS, 1000);
  };
}

function sendDirectionConfig() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({
    type: "config",
    direction: directionSelect.value
  }));

  logDiagnostic(`config.direction=${directionSelect.value}`);
}

directionSelect.addEventListener("change", () => {
  sendDirectionConfig();

  transcriptText = "";
  translationText = "";
  transcriptEl.textContent = "ここに認識結果が表示されます";
  translationEl.textContent = "ここに翻訳結果が表示されます";

  statusEl.textContent =
    directionSelect.value === "ja-en"
      ? "日本語 → English に設定しました。"
      : "English → 日本語 に設定しました。";
});

audioModeSelect.addEventListener("change", () => {
  statusEl.textContent =
    audioModeSelect.value === "meeting"
      ? "オンライン会議モードに設定しました。"
      : "通常マイクモードに設定しました。";

  logDiagnostic(`audio.mode=${audioModeSelect.value}`);
});

function handleEvent(event) {
  if (event.type === "proxy.connected") {
    statusEl.textContent = "OpenAIに接続しました。";
    logDiagnostic("proxy.connected");
    return;
  }

  if (event.type === "proxy.disconnected") {
    statusEl.textContent = "OpenAI接続が切断されました。";
    logDiagnostic("proxy.disconnected");
    return;
  }

  if (event.type === "error") {
    const msg = event.message || event.error?.message || "Unknown error";
    errorEl.textContent = msg;
    logDiagnostic("ERROR: " + msg);
    return;
  }

  if (event.type === "session.updated") {
    logDiagnostic("session.updated");
    return;
  }

  if (
    event.type.includes("speech_started") ||
    event.type.includes("speech_stopped") ||
    event.type.includes("committed") ||
    event.type.includes("response.created") ||
    event.type.includes("response.done")
  ) {
    logDiagnostic(event.type);
  }

  if (event.type === "session.input_transcript.delta") {
    transcriptText += event.delta || "";
    transcriptEl.textContent = transcriptText;
    return;
  }

  if (event.type === "session.output_transcript.delta") {
    translationText += event.delta || "";
    translationEl.textContent = translationText;
    return;
  }

  console.log("OpenAI event:", event.type, event);
}

recordBtn.addEventListener("click", async () => {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function ensureWSOpen() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  connectWS();

  await new Promise((resolve) => {
    const timer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        clearInterval(timer);
        resolve();
      }
    }, 50);
  });
}

function getAudioConstraints() {
  if (audioModeSelect.value === "meeting") {
    return {
      channelCount: 1,
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    };
  }

  return {
    channelCount: 1,
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true
  };
}

async function startRecording() {
  errorEl.textContent = "";

  await ensureWSOpen();
  sendDirectionConfig();

  transcriptText = "";
  translationText = "";
  transcriptEl.textContent = "";
  translationEl.textContent = "";

  // clear系イベントは送らない。
  // この翻訳用エンドポイントでは input_audio_buffer.clear が未対応の場合があるため。

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: getAudioConstraints(),
      video: false
    });
  } catch (err) {
    errorEl.textContent = "マイクへのアクセスが拒否されました: " + err.message;
    logDiagnostic("microphone.error: " + err.message);
    return;
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  sourceNode = audioContext.createMediaStreamSource(mediaStream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  sourceNode.connect(analyser);

  processor = audioContext.createScriptProcessor(4096, 1, 1);
  sourceNode.connect(processor);

  const silentGain = audioContext.createGain();
  silentGain.gain.value = 0;
  processor.connect(silentGain);
  silentGain.connect(audioContext.destination);

  isRecording = true;

  processor.onaudioprocess = (e) => {
    if (!isRecording) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);

    const resampled = resampleFloat32(
      input,
      audioContext.sampleRate,
      TARGET_SAMPLE_RATE
    );

    const pcm16 = floatToPCM16(resampled);
    const base64 = pcm16ToBase64(pcm16);

    ws.send(JSON.stringify({
      type: "session.input_audio_buffer.append",
      audio: base64
    }));
  };

  recordBtn.classList.add("recording");
  recordBtn.textContent = "STOP";

  statusEl.textContent =
    audioModeSelect.value === "meeting"
      ? "録音中：オンライン会議モード。相手の2回目の発話を確認してください。"
      : "録音中：通常マイクモード。話してください。";

  logDiagnostic(
    `recording.start: sampleRate=${audioContext.sampleRate}, mode=${audioModeSelect.value}`
  );

  drawWave();
}

function stopRecording() {
  stopLocalAudioOnly();
  statusEl.textContent = "停止しました。もう一度録音できます。";
  logDiagnostic("recording.stop");
}

function stopLocalAudioOnly() {
  isRecording = false;

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (sourceNode) {
    sourceNode.disconnect();
    sourceNode = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  clearCanvas();
  meterEl.style.width = "0%";
  volumeTextEl.textContent = "音量: 0%";

  recordBtn.classList.remove("recording");
  recordBtn.textContent = "START";
}

function resampleFloat32(input, fromRate, toRate) {
  if (fromRate === toRate) return input;

  const ratio = fromRate / toRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const index = i * ratio;
    const indexFloor = Math.floor(index);
    const indexCeil = Math.min(indexFloor + 1, input.length - 1);
    const weight = index - indexFloor;

    output[i] =
      input[indexFloor] * (1 - weight) +
      input[indexCeil] * weight;
  }

  return output;
}

function floatToPCM16(float32Array) {
  const pcm16 = new Int16Array(float32Array.length);

  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }

  return pcm16;
}

function pcm16ToBase64(pcm16) {
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = "";
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(
      null,
      bytes.subarray(i, i + chunkSize)
    );
  }

  return btoa(binary);
}

function drawWave() {
  if (!isRecording) return;

  animationId = requestAnimationFrame(drawWave);

  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, W, H);

  if (!analyser) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);

  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    const normalized = (data[i] - 128) / 128;
    sum += normalized * normalized;
  }

  const rms = Math.sqrt(sum / data.length);
  const volume = Math.min(100, Math.round(rms * 300));
  meterEl.style.width = volume + "%";
  volumeTextEl.textContent = `音量: ${volume}%`;

  ctx.strokeStyle = "#00ff88";
  ctx.lineWidth = 2;
  ctx.beginPath();

  const step = W / data.length;

  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 128) * (H / 2);
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  }

  ctx.stroke();
}

function clearCanvas() {
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
}

window.addEventListener("beforeunload", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "session.close" }));
  }
});
</script>
</body>
</html>
