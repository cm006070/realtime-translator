<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realtime Voice Translator</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0f; color: #eee; display: flex; justify-content: center; }
.container { width: 100%; max-width: 980px; padding: 32px 20px; }
h1 { font-size: 44px; margin: 0 0 20px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
select, label.toggle { padding: 12px 14px; background: #111118; color: white; border: 1px solid #333; border-radius: 8px; font-size: 15px; }
label.toggle { display: flex; gap: 8px; align-items: center; }
button { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #00ff88; background: transparent; color: #00ff88; font-size: 14px; cursor: pointer; }
button.recording { border-color: #ff3366; color: #ff3366; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
.panel { background: #111118; border: 1px solid #222235; border-radius: 8px; padding: 18px; min-height: 220px; white-space: pre-wrap; line-height: 1.7; overflow-wrap: anywhere; }
.status { margin-top: 16px; color: #aaa; }
.error { margin-top: 12px; color: #ff3366; }
.note { color: #bbb; font-size: 14px; line-height: 1.6; margin: 12px 0; }
.meterWrap { width: 100%; height: 12px; background: #1a1a25; border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
#levelBar { height: 100%; width: 0%; background: #00ff88; }
#eventLog { min-height: 130px; max-height: 180px; overflow: auto; font-size: 13px; color: #ccc; }
canvas { width: 100%; height: 70px; margin: 16px 0; }
@media (max-width: 700px) { .panels { grid-template-columns: 1fr; } h1 { font-size: 34px; } }
</style>
</head>
<body>
<div class="container">
  <h1>VOICE TRANSLATOR</h1>

  <div class="controls">
    <select id="directionSelect">
      <option value="ja-en">日本語 → English</option>
      <option value="en-ja">English → 日本語</option>
    </select>

    <select id="audioModeSelect" title="オンライン会議の相手音声を拾う場合は会議モードを推奨">
      <option value="meeting" selected>オンライン会議モード（エコー除去OFF）</option>
      <option value="myvoice">自分の声モード（エコー除去ON）</option>
    </select>

    <label class="toggle" title="通常はOFF推奨。自分の声だけを近くのマイクで拾う場合のみONを試す。">
      <input type="checkbox" id="serverNrCheck" />
      OpenAI側ノイズ除去
    </label>
  </div>

  <div class="note">
    相手のオンライン音声をPCスピーカーからマイクで拾う場合は、まず「オンライン会議モード」で試してください。
    ブラウザのエコー除去・ノイズ抑制・自動音量調整をOFFにします。
  </div>

  <canvas id="wave"></canvas>
  <div class="meterWrap"><div id="levelBar"></div></div>
  <div class="note" id="levelText">音量: 0%</div>

  <button id="recordBtn">START</button>

  <div class="status" id="status">接続中...</div>
  <div class="error" id="error"></div>

  <div class="panels">
    <div>
      <h3>認識テキスト</h3>
      <div class="panel" id="transcript">ここに認識結果が表示されます</div>
    </div>
    <div>
      <h3>翻訳結果</h3>
      <div class="panel" id="translation">ここに翻訳結果が表示されます</div>
    </div>
  </div>

  <h3>診断ログ</h3>
  <div class="panel" id="eventLog">speech_started / speech_stopped などを表示します</div>
</div>

<script>
let ws = null;
let mediaStream = null;
let audioContext = null;
let sourceNode = null;
let processor = null;
let analyser = null;
let muteGain = null;
let isRecording = false;
let animationId = null;

let transcriptText = "";
let translationText = "";
let lastLogLines = [];

const TARGET_SAMPLE_RATE = 24000;

const directionSelect = document.getElementById("directionSelect");
const audioModeSelect = document.getElementById("audioModeSelect");
const serverNrCheck = document.getElementById("serverNrCheck");
const recordBtn = document.getElementById("recordBtn");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const transcriptEl = document.getElementById("transcript");
const translationEl = document.getElementById("translation");
const eventLogEl = document.getElementById("eventLog");
const levelBar = document.getElementById("levelBar");
const levelText = document.getElementById("levelText");
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");

connectWS();

function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    statusEl.textContent = "接続完了。録音できます。";
    sendConfig();
  };

  ws.onmessage = (e) => {
    let event;
    try { event = JSON.parse(e.data); } catch { return; }
    handleEvent(event);
  };

  ws.onerror = () => { errorEl.textContent = "WebSocket接続エラー"; };

  ws.onclose = () => {
    statusEl.textContent = "切断されました。再接続します...";
    stopLocalAudioOnly();
    setTimeout(connectWS, 1000);
  };
}

function sendConfig() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: "config",
    direction: directionSelect.value,
    audioMode: audioModeSelect.value,
    enableServerNoiseReduction: serverNrCheck.checked
  }));
}

function logEvent(line) {
  const now = new Date().toLocaleTimeString();
  lastLogLines.push(`[${now}] ${line}`);
  if (lastLogLines.length > 80) lastLogLines.shift();
  eventLogEl.textContent = lastLogLines.join("\n");
  eventLogEl.scrollTop = eventLogEl.scrollHeight;
}

[directionSelect, audioModeSelect, serverNrCheck].forEach(el => {
  el.addEventListener("change", () => {
    sendConfig();
    logEvent(`config: direction=${directionSelect.value}, audioMode=${audioModeSelect.value}, serverNR=${serverNrCheck.checked}`);
    statusEl.textContent = "設定を更新しました。";
  });
});

function handleEvent(event) {
  if (event.type === "proxy.connected") {
    statusEl.textContent = "OpenAIに接続しました。";
    logEvent("proxy.connected");
    return;
  }

  if (event.type === "proxy.disconnected") {
    statusEl.textContent = "OpenAI接続が切断されました。";
    logEvent("proxy.disconnected");
    return;
  }

  if (event.type === "error") {
    const msg = event.message || event.error?.message || "Unknown error";
    errorEl.textContent = msg;
    logEvent(`ERROR: ${msg}`);
    return;
  }

  // Existing translation endpoint event names used by the original program.
  if (event.type === "session.input_transcript.delta") {
    transcriptText += event.delta || "";
    transcriptEl.textContent = transcriptText;
    return;
  }

  if (event.type === "session.output_transcript.delta") {
    translationText += event.delta || "";
    translationEl.textContent = translationText;
    return;
  }

  // Diagnostic events. Names differ slightly between Realtime variants, so catch broadly.
  if (event.type.includes("speech_started") || event.type.includes("speech_stopped") || event.type.includes("committed") || event.type.includes("cleared") || event.type.includes("session.updated")) {
    logEvent(event.type);
  }

  console.log("OpenAI event:", event.type, event);
}

recordBtn.addEventListener("click", async () => {
  if (isRecording) stopRecording();
  else await startRecording();
});

async function ensureWSOpen() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  connectWS();
  await new Promise((resolve) => {
    const timer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        clearInterval(timer);
        resolve();
      }
    }, 50);
  });
}

function getAudioConstraints() {
  if (audioModeSelect.value === "meeting") {
    return {
      channelCount: 1,
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    };
  }

  return {
    channelCount: 1,
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true
  };
}

async function startRecording() {
  errorEl.textContent = "";
  await ensureWSOpen();
  sendConfig();

  // Clear stale audio buffer before a new recording run.
  ws.send(JSON.stringify({ type: "client.reset_input_audio" }));

  transcriptText = "";
  translationText = "";
  transcriptEl.textContent = "";
  translationEl.textContent = "";
  lastLogLines = [];
  eventLogEl.textContent = "";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: getAudioConstraints(),
      video: false
    });
  } catch (err) {
    errorEl.textContent = "マイクへのアクセスが拒否されました: " + err.message;
    return;
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();

  sourceNode = audioContext.createMediaStreamSource(mediaStream);

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  sourceNode.connect(analyser);

  processor = audioContext.createScriptProcessor(4096, 1, 1);
  muteGain = audioContext.createGain();
  muteGain.gain.value = 0;
  sourceNode.connect(processor);
  // ScriptProcessor must be connected downstream in many browsers.
  // Use zero gain to keep processing active without local speaker feedback.
  processor.connect(muteGain);
  muteGain.connect(audioContext.destination);

  isRecording = true;

  processor.onaudioprocess = (e) => {
    if (!isRecording) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);
    updateLevel(input);

    const resampled = resampleFloat32(input, audioContext.sampleRate, TARGET_SAMPLE_RATE);
    const pcm16 = floatToPCM16(resampled);
    const base64 = pcm16ToBase64(pcm16);

    ws.send(JSON.stringify({
      type: "session.input_audio_buffer.append",
      audio: base64
    }));
  };

  recordBtn.classList.add("recording");
  recordBtn.textContent = "STOP";
  statusEl.textContent = audioModeSelect.value === "meeting"
    ? "録音中：オンライン会議モード。相手の2回目の発話を確認してください。"
    : "録音中：自分の声モード。";

  logEvent(`recording.start: sampleRate=${audioContext.sampleRate}, mode=${audioModeSelect.value}`);
  drawWave();
}

function stopRecording() {
  stopLocalAudioOnly();
  statusEl.textContent = "停止しました。もう一度録音できます。";
  logEvent("recording.stop");
}

function stopLocalAudioOnly() {
  isRecording = false;

  if (processor) {
    processor.disconnect();
    processor.onaudioprocess = null;
    processor = null;
  }

  if (sourceNode) {
    sourceNode.disconnect();
    sourceNode = null;
  }

  if (muteGain) {
    muteGain.disconnect();
    muteGain = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  clearCanvas();
  levelBar.style.width = "0%";
  levelText.textContent = "音量: 0%";

  recordBtn.classList.remove("recording");
  recordBtn.textContent = "START";
}

function updateLevel(float32Array) {
  let sum = 0;
  for (let i = 0; i < float32Array.length; i++) sum += float32Array[i] * float32Array[i];
  const rms = Math.sqrt(sum / float32Array.length);
  const percent = Math.min(100, Math.round(rms * 400));
  levelBar.style.width = `${percent}%`;
  levelText.textContent = `音量: ${percent}%`;
}

function resampleFloat32(input, fromRate, toRate) {
  if (fromRate === toRate) return input;
  const ratio = fromRate / toRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);
  for (let i = 0; i < outputLength; i++) {
    const index = i * ratio;
    const indexFloor = Math.floor(index);
    const indexCeil = Math.min(indexFloor + 1, input.length - 1);
    const weight = index - indexFloor;
    output[i] = input[indexFloor] * (1 - weight) + input[indexCeil] * weight;
  }
  return output;
}

function floatToPCM16(float32Array) {
  const pcm16 = new Int16Array(float32Array.length);
  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return pcm16;
}

function pcm16ToBase64(pcm16) {
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function drawWave() {
  if (!isRecording) return;
  animationId = requestAnimationFrame(drawWave);

  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
  if (!analyser) return;

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);

  ctx.strokeStyle = "#00ff88";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const step = W / data.length;
  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 128) * (H / 2);
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  }
  ctx.stroke();
}

function clearCanvas() {
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
}

window.addEventListener("beforeunload", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "session.close" }));
  }
});
</script>
</body>
</html>
